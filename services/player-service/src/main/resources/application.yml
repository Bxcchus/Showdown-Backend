spring:
  application:
    name: player-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/pinkward_players}
    username: ${DATABASE_USERNAME:player_service}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:9102}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

pinkward:
  security:
    audience: ${JWT_AUDIENCE:pinkward-api}
  presence:
    ttl: ${PRESENCE_TTL:45s}
  riot-link:
    challenge-ttl: ${RIOT_LINK_CHALLENGE_TTL:90s}
  party:
    local-simulation: ${PARTY_LOCAL_SIMULATION:false}
    invitation-ttl: ${PARTY_INVITATION_TTL:5m}
    queue:
      token-uri: ${IDENTITY_TOKEN_URI:http://localhost:9000/oauth2/token}
      matchmaking-uri: ${MATCHMAKING_INTERNAL_URI:http://localhost:8081}
      client-id: ${PLAYER_CLIENT_ID:pinkward-player}
      client-secret: ${PLAYER_CLIENT_SECRET}
