global:
  resolve_timeout: 5m

route:
  receiver: production-webhook
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: production-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager-webhook-url
        send_resolved: true
