name: Showdown V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showdown-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress verify

  java-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode --no-transfer-progress -Psecurity-scan -DskipTests verify
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Audit and build the web application
        working-directory: web-app
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test the watcher
        working-directory: watcher
        run: |
          rustup show active-toolchain
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0
          detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact --exit-code=1
      - name: Verify local secret hygiene and loopback bindings
        shell: pwsh
        run: |
          ./scripts/test-local-security.ps1 -SkipActiveEnvironment
          ./scripts/test-production-security.ps1
      - name: Validate Compose
        run: docker compose --env-file infra/.env.example -f infra/compose.yml config --quiet
      - name: Build service images
        run: |
          docker build -t showdown/identity-service:ci -f services/identity-service/Dockerfile .
          docker build -t showdown/api-gateway:ci -f services/api-gateway/Dockerfile .
          docker build -t showdown/player-service:ci -f services/player-service/Dockerfile .
          docker build -t showdown/matchmaking-service:ci -f services/matchmaking-service/Dockerfile .
          docker build -t showdown/match-service:ci -f services/match-service/Dockerfile .
          docker build -t showdown/caddy:ci -f infra/caddy/Dockerfile .
          docker build -t showdown/web-app:ci -f web-app/Dockerfile .
      - name: Verify non-root users and image contents
        shell: pwsh
        run: ./scripts/test-image-hygiene.ps1 -ImagePrefix 'showdown/'
      - name: Scan application images with Trivy
        run: |
          for image in identity-service api-gateway player-service matchmaking-service match-service caddy web-app; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v showdown-trivy-cache:/root/.cache/trivy \
              ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
              image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --skip-version-check "showdown/$image:ci"
          done
      - name: Run isolated 1v1 and 5v5 Docker MMR tests
        shell: pwsh
        run: ./scripts/test-docker-mmr.ps1
