name: Showdown V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showdown-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress verify

  java-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode --no-transfer-progress -Psecurity-scan -DskipTests verify
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHOWDOWN_FRONTEND_CONTEXT: ../showdown-frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require the standalone frontend repository
        env:
          FRONTEND_REPOSITORY: ${{ vars.SHOWDOWN_FRONTEND_REPOSITORY }}
        run: test -n "$FRONTEND_REPOSITORY"
      - name: Checkout the standalone frontend used by Compose
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.SHOWDOWN_FRONTEND_REPOSITORY }}
          path: showdown-frontend
          ref: ${{ vars.SHOWDOWN_FRONTEND_REF || 'main' }}
      - name: Reject committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --config=/repo/.gitleaks.toml --redact --exit-code=1
      - name: Verify local secret hygiene and loopback bindings
        shell: pwsh
        run: |
          ./scripts/test-local-security.ps1 -SkipActiveEnvironment
          ./scripts/test-production-security.ps1
          ./scripts/test-production-oidc-configuration.ps1
      - name: Validate Compose
        run: docker compose --env-file infra/.env.example -f infra/compose.yml config --quiet
      - name: Build and pull every Compose image
        run: |
          docker compose --env-file infra/.env.example -f infra/compose.yml build
          docker compose --env-file infra/.env.example -f infra/compose.yml pull --ignore-buildable
      - name: Verify non-root users and image contents
        shell: pwsh
        run: ./scripts/test-image-hygiene.ps1
      - name: Scan every Compose image with Trivy
        run: |
          mapfile -t images < <(docker compose --env-file infra/.env.example -f infra/compose.yml config --images | sort -u)
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v showdown-trivy-cache:/root/.cache/trivy \
              ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
              image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --skip-version-check "$image"
          done
      - name: Run isolated 1v1 and 5v5 Docker MMR tests
        shell: pwsh
        run: ./scripts/test-docker-mmr.ps1
      - name: Run the isolated external OIDC login flow
        shell: pwsh
        run: ./scripts/test-local-oidc.ps1
      - name: Install pinned age backup tooling
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/age-v1.3.2-linux-amd64.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age-v1.3.2-linux-amd64.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/age-v1.3.2-linux-amd64.tar.gz --directory /tmp
          sudo install --mode 0755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
      - name: Verify encrypted backup and isolated four-database restore
        shell: pwsh
        run: ./scripts/test-encrypted-backup-restore.ps1
